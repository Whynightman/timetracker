<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Timetracker</title>
<style>
#barContainer { width: 100%; background: #eee; border: 1px solid #ccc; height: 30px; position: relative; }
#bar { background: #4caf50; width: 0%; height: 100%; }
#info { margin-top: 10px; }
</style>
</head>
<body>
<h1>Timetracker</h1>
<label for="startTime">Startzeit:</label>
<input type="datetime-local" id="startTime">
<label for="expectedEndTime">Voraussichtliche Endzeit:</label>
<input type="datetime-local" id="expectedEndTime">
<label for="hourlyRate">Stundenlohn (&euro;):</label>
<input type="number" id="hourlyRate" value="0" step="0.01">
<button id="startBtn">Start</button>
<button id="stopBtn" disabled>Stop</button>

<div id="barContainer"><div id="bar"></div></div>
<div id="info">
<p>Verstrichene Zeit: <span id="elapsed">0:00:00</span></p>
<p>Verbleibende Zeit: <span id="remaining">0:00:00</span></p>
<p>Fortschritt: <span id="progress">0%</span></p>
<p>Verdienst: &euro;<span id="earnings">0.00</span></p>
</div>

<script>
let timer = null;
let startTime = null;
let expectedEnd = null;
let rate = 0;

function formatTime(seconds) {
  const hrs = Math.floor(seconds / 3600);
  const mins = Math.floor((seconds % 3600) / 60);
  const secs = Math.floor(seconds % 60);
  return `${hrs}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
}

function update() {
  const now = new Date();
  const elapsedSec = (now - startTime) / 1000;
  const totalSec = (expectedEnd - startTime) / 1000;
  const progress = Math.min(elapsedSec / totalSec, 1);
  const remainingSec = Math.max(totalSec - elapsedSec, 0);

  document.getElementById('elapsed').textContent = formatTime(elapsedSec);
  document.getElementById('remaining').textContent = formatTime(remainingSec);
  document.getElementById('progress').textContent = Math.round(progress * 100) + '%';
  document.getElementById('bar').style.width = (progress * 100) + '%';
  const earned = (elapsedSec / 3600) * rate;
  document.getElementById('earnings').textContent = earned.toFixed(2);
}

document.getElementById('startBtn').addEventListener('click', () => {
  const startInput = document.getElementById('startTime').value;
  startTime = startInput ? new Date(startInput) : new Date();
  document.getElementById('startTime').value = startTime.toISOString().slice(0,16);
  const expectedInput = document.getElementById('expectedEndTime').value;
  if (!expectedInput) {
    alert('Bitte voraussichtliche Endzeit angeben.');
    return;
  }
  expectedEnd = new Date(expectedInput);
  rate = parseFloat(document.getElementById('hourlyRate').value) || 0;
  document.getElementById('startBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;
  document.getElementById('bar').style.width = '0%';
  document.getElementById('elapsed').textContent = '0:00:00';
  document.getElementById('remaining').textContent = formatTime((expectedEnd - startTime) / 1000);
  document.getElementById('progress').textContent = '0%';
  document.getElementById('earnings').textContent = '0.00';
  update();
  timer = setInterval(update, 1000);
});

document.getElementById('stopBtn').addEventListener('click', () => {
  if (timer) {
    clearInterval(timer);
    update();
  }
  document.getElementById('stopBtn').disabled = true;
  document.getElementById('startBtn').disabled = false;
});
</script>
</body>
</html>
